<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Učebna – Leernio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b9:#0b2a6f;--b8:#1e3a8a;--b7:#1d4ed8;--b6:#2563eb;--b5:#3b82f6;--b2:#bfdbfe;--b1:#dbeafe;--b0:#eff6ff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f4f7fd;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}h4{font-size:14px;margin-bottom:10px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
a{color:var(--b7)}
.mut{color:var(--mut)}.xs{font-size:12px}.sm{font-size:13px}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.row.end{justify-content:flex-end}.spacer{flex:1}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top */
.top{height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--b8);cursor:pointer;line-height:1.05}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--b5);letter-spacing:.14em}
.crumb{display:flex;align-items:center;gap:6px;color:var(--mut);min-width:0}
.crumb b{color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:#334155;flex:none}
.iconbtn:hover{background:var(--b0);color:var(--b7)}
.iconbtn.s{width:30px;height:30px}
.who{display:flex;align-items:center;gap:8px}.who b{display:block;font-size:13px}.who small{color:var(--mut);font-size:11px}
.demo{display:flex;align-items:center;gap:6px;background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:3px 4px 3px 8px;font-size:12px;font-weight:600}
.demo select{padding:3px 6px;font-size:12px;width:auto;max-width:200px;border-color:#fde68a}
/* layout */
.layout{display:grid;grid-template-columns:264px 1fr;min-height:calc(100vh - 60px)}
.layout.collapsed{grid-template-columns:76px 1fr}
.side{background:#fff;border-right:1px solid var(--line);padding:10px 12px 24px 0;overflow:auto;position:sticky;top:60px;height:calc(100vh - 60px)}
.nav{display:flex;align-items:center;gap:14px;padding:9px 16px 9px 24px;border-radius:0 24px 24px 0;cursor:pointer;color:#334155;font-weight:500;white-space:nowrap;overflow:hidden}
.nav:hover{background:#f1f5f9}.nav.on{background:var(--b1);color:var(--b8)}
.nav .t{overflow:hidden;text-overflow:ellipsis}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none}
.side h6{margin:16px 0 4px 24px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600}
.collapsed .side .t,.collapsed .side h6,.collapsed .side .sidenote{display:none}
.main{padding:24px;min-width:0}
.wrap{max-width:1000px;margin:0 auto}.wrap.wide{max-width:1200px}
@media (max-width:860px){
 .layout,.layout.collapsed{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:60px;width:270px;z-index:35;box-shadow:0 10px 40px rgba(0,0,0,.15);transition:transform .2s}
 .layout.collapsed .side{transform:translateX(-105%)}
 .collapsed .side .t,.collapsed .side h6{display:initial}
 .hide-sm{display:none!important}
 .main{padding:16px}
}
/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--b7);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--b0)}
.btn.pri{background:var(--b6);border-color:var(--b6);color:#fff}.btn.pri:hover{background:var(--b7)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:#b91c1c}.btn.dangerbg{background:#dc2626;border-color:#dc2626}
.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.65;cursor:wait}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b5);outline-offset:-1px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--b6)}
.field label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 10px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:400;margin:0;padding:3px 0;cursor:pointer}
.radios{display:flex;gap:16px;flex-wrap:wrap}.radios label{display:flex;gap:6px;align-items:center;font-weight:500;font-size:14px;color:var(--ink);margin:0;cursor:pointer}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;white-space:nowrap}
.chip.blue{background:var(--b1);color:var(--b8)}.chip.green{background:#dcfce7;color:#166534}.chip.red{background:#fee2e2;color:#991b1b}.chip.amber{background:#fef3c7;color:#92400e}.chip.violet{background:#ede9fe;color:#5b21b6}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none;width:32px;height:32px}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.empty .eic{width:72px;height:72px;border-radius:50%;background:var(--b0);color:var(--b6);display:grid;place-items:center;margin:0 auto 14px}
.empty h3{color:var(--ink);margin-bottom:6px}
.lnk{display:block;color:var(--b7);cursor:pointer;text-decoration:none;padding:4px 0;font-weight:500}
.lnk:hover{text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
/* room cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.rcard{overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-height:260px;transition:box-shadow .15s}
.rcard:hover{box-shadow:0 6px 24px rgba(30,58,138,.14)}
.pat{background-color:var(--c)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{margin:0!important;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);transition:transform .1s}
.sw:hover span{transform:scale(1.08)}
.sw input:checked+span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.sw input:checked+span::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.sw.custom span{background:conic-gradient(#ef4444,#f59e0b,#22c55e,#06b6d4,#3b82f6,#a855f7,#ef4444)}
.sw.custom input[type=color]{position:absolute;inset:0;opacity:0;width:30px;height:30px;padding:0;border:0;cursor:pointer;pointer-events:auto}
.motifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.motif{margin:0!important;cursor:pointer;position:relative}
.motif input{position:absolute;opacity:0;pointer-events:none}
.motif .mt{display:block;height:58px;border-radius:10px;border:2px solid transparent;transition:border-color .1s}
.motif input:checked~.mt{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.motif b{display:block;font-size:12px;font-weight:500;color:#475569;margin-top:4px;text-align:center}
.motif input:checked~b{color:var(--ink);font-weight:600}
.tprev{height:110px;border-radius:12px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.tprev h3{font-size:22px}
.rcard .bn{min-height:112px;padding:16px 18px;color:#fff;position:relative}
.rcard .bn h3{font-size:19px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
.rcard .bn .sub{opacity:.9;font-size:13px}
.rcard .bav{position:absolute;right:16px;bottom:-30px;border:3px solid #fff;border-radius:50%}
.rcard .rb{padding:20px 96px 10px 18px;flex:1;display:grid;gap:8px;align-content:start}
.rcard .rf{border-top:1px solid var(--line);padding:8px 12px;display:flex;justify-content:flex-end;gap:4px;color:var(--mut)}
.mini{font-size:13px}
/* room */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-24px -24px 24px;padding:0 24px;background:#fff;position:sticky;top:60px;z-index:20;overflow-x:auto}
@media (max-width:860px){.tabs{margin:-16px -16px 16px;padding:0 12px}}
.tab{padding:16px 16px 13px;border-bottom:3px solid transparent;cursor:pointer;font-weight:500;color:#475569;white-space:nowrap}
.tab:hover{color:var(--b7);background:var(--b0)}.tab.on{color:var(--b7);border-color:var(--b6)}
.banner{min-height:190px;border-radius:var(--r);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;margin-bottom:20px;position:relative}
.banner h1{font-size:32px}.banner .bset{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.92)}
.cols{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.cols.s{grid-template-columns:200px 1fr}
.icols{display:grid;grid-template-columns:1fr 310px;gap:20px;align-items:start}
@media (max-width:820px){.cols,.cols.s,.icols{grid-template-columns:1fr}}
.composer textarea{min-height:56px}
.composer .row{align-items:flex-start;margin-bottom:10px}
.feed>*{margin-bottom:14px}
.post .ptext{margin-top:10px;white-space:normal}
.annc{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
.annc:hover{background:#fafcff}
.lesson{border-left:4px solid #059669}
.sech{display:flex;align-items:baseline;gap:10px;margin:6px 2px 12px;flex-wrap:wrap}.sech h2{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--b8)}
.lchap{border-left:4px solid #059669}.ldate{font-weight:700;color:#047857;font-size:14px;white-space:nowrap}
.linfo{padding:12px 16px 14px;border-bottom:1px solid var(--line)}.linfo .lbody{margin-top:10px}
.rf .iconbtn{color:var(--mut)}.rf .iconbtn:hover{color:var(--b7)}
.lbody{margin:12px 0 0;padding:12px 14px;background:#f8fafc;border-radius:8px}
.hwlink{margin-top:10px;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px dashed #fdba74;border-radius:8px;color:#9a3412;cursor:pointer;background:#fff7ed}
/* classwork */
.scope{padding:8px 0;position:sticky;top:130px}
.scope h4{padding:8px 16px 0}
.sitem{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;font-weight:500}
.sitem:hover{background:#f8fafc}.sitem.on{background:var(--b1);color:var(--b8)}
.scope p{padding:8px 16px 4px;margin:0}
.chap{margin-bottom:16px;overflow:hidden}
.chh{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 14px;border-bottom:2px solid var(--b6)}
.cht{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0;flex-wrap:wrap}
.cht h3{font-size:18px;color:var(--b8)}
.acts{display:flex;gap:2px;flex:none}
.irow{display:flex;align-items:center;gap:14px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.chh+.irow{border-top:0}
.irow:hover{background:#f8fbff}
.irow .it{font-weight:500}
.irow.noitem{cursor:default;color:var(--mut);font-size:13px}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
/* menu */
details.menu{position:relative}
details.menu summary{list-style:none}details.menu summary::-webkit-details-marker{display:none}
.mlist{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.14);padding:6px;min-width:210px;z-index:25}
.mlist button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;font-weight:500;cursor:pointer;text-align:left;color:var(--ink)}
.mlist button:hover{background:var(--b0)}.mlist hr{margin:6px 0}
/* item */
.ihead{display:flex;gap:16px;align-items:flex-start}
.ihead h1{color:var(--b8);font-size:26px}
.body{white-space:normal;margin-bottom:16px}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:12px 0}
.att{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff;min-width:0;text-decoration:none;color:var(--ink)}
.att:hover{border-color:var(--b2);background:#fafcff}
.upl{cursor:default;background:#f8fbff}.uerr{background:#fef2f2;border-color:#fecaca}.bar{height:6px;border-radius:3px;background:var(--b1);overflow:hidden;margin:5px 0 3px}.bar i{display:block;height:100%;background:var(--b6);transition:width .2s}
.ext{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;letter-spacing:.03em}
.testbox{border:1px solid #ddd6fe;background:#faf5ff;border-radius:10px;padding:14px;margin:12px 0}
.graded{background:var(--b0);border-radius:10px;padding:14px;margin:12px 0}
.graded .big{font-size:28px;font-weight:700;color:var(--b8)}.graded .big small{font-size:15px;color:var(--mut);font-weight:500}
.cm{margin-top:8px;font-style:italic;color:#334155}
.thread{margin-top:16px}
.msg{display:flex;gap:10px;margin:10px 0}.msg .bub{background:#f1f5f9;border-radius:10px;padding:8px 12px;flex:1}
.stats{gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-size:24px;color:var(--b8)}.stat span{font-size:12px;color:var(--mut)}
/* tables */
.tblw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--mut);font-weight:600;background:#f8fafc;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.gb th.col{min-width:120px;white-space:normal;vertical-align:bottom}
.gb td.c{text-align:center;cursor:pointer}.gb td.c:hover{background:var(--b0)}
.gb td.na{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#f1f5f9 6px,#f1f5f9 12px)}
.gb td:first-child,.gb th:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:190px}
.gb th:first-child{background:#f8fafc}
.gb .pts{font-weight:600}.gb .gr{display:block;font-size:12px;color:var(--b7);font-weight:600}
.people{margin-bottom:32px}.people .ph{border-bottom:2px solid var(--b6);padding-bottom:10px;margin-bottom:6px}
.people h2{color:var(--b8)}
.prow{display:flex;align-items:center;gap:14px;padding:10px 6px;border-bottom:1px solid var(--line)}
/* modal */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.mh h3{display:flex;align-items:center;gap:10px}
.mb{padding:18px 20px;display:grid;gap:14px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal[data-k="material"] .k-due,.modal[data-k="material"] .k-pts,.modal[data-k="material"] .k-test,.modal[data-k="material"] .k-lesson,
.modal[data-k="task"] .k-test,.modal[data-k="task"] .k-lesson,
.modal[data-k="test"] .k-lesson,
.modal[data-k="lesson"] .k-due,.modal[data-k="lesson"] .k-pts,.modal[data-k="lesson"] .k-test{display:none}
.prev img,.prev video{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:8px}
.prev audio{width:100%}
.prev iframe{width:100%;height:70vh;border:0;border-radius:8px}
pre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;overflow:auto;font-size:12px;line-height:1.5}
.log{max-height:320px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:200;font-weight:500}
#toast.on{opacity:1;transform:translateX(-50%)}
.subtabs{display:flex;gap:6px;margin-bottom:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
/* =========================================================
   UČEBNA – vnější aplikace pro IS Leernio
   Data: lokální stav (demo). Napojení na IS přes postMessage
   (viz Správa učeben → Integrace s IS).
   ========================================================= */
const UC = window.UCEBNA_CONFIG || {};
const CONFIG = {
  api: /^https:\/\/script\.google(usercontent)?\.com\//.test(UC.api||'') || /^http:\/\/localhost(:\d+)?\//.test(UC.api||'') ? UC.api : '',
  isOrigin: UC.isOrigin || 'https://leernio-cz.github.io',   // jediný povolený rodič (IS Leernio)
  isUrl: UC.isUrl || 'https://leernio-cz.github.io/#ucebna',
  maxFile: 300 * 1024 * 1024,
  part: 4 * 1024 * 1024,
  single: 4 * 1024 * 1024,    // jedním požadavkem jen do 4 MB, větší po částech po 4 MB (žádný požadavek není větší než u fotky)
  parallel: 3,
  pollMs: 30000
};
/* Předměty, které Leernio vyučuje (kód = kód v Seznamu studentů / učitelů) */
const SUBJECTS = [
  {id:'B01',name:'Maturita – ČJL CERMAT',color:'#1d4ed8',theme:'knihy'},
  {id:'B02',name:'Maturita – AJ CERMAT',color:'#0e7490',theme:'vlny'},
  {id:'B03',name:'Maturita – M CERMAT',color:'#4338ca',theme:'matika'},
  {id:'C01',name:'Klavír',color:'#7c3aed',theme:'noty'},
  {id:'C02',name:'Certifikát – AJ',color:'#0f766e',theme:'geometrie'}
];
const COLORS = ['#1d4ed8','#0e7490','#7c3aed','#0f766e','#b45309','#be185d','#4338ca','#15803d','#0369a1'];
const KIND = {
  material:{l:'Materiál',c:'#2563eb',i:'book'},
  task:{l:'Úkol',c:'#ea580c',i:'task'},
  test:{l:'Test',c:'#7c3aed',i:'quiz'},
  lesson:{l:'Zápis hodiny',c:'#059669',i:'cal'}
};
const ROLE = {admin:'Správce',teacher:'Učitel',student:'Student'};
const GRADES = ['1','1−','2','2−','3','3−','4','4−','5','N'];

const isAdmin = u => !!u && u.role === 'admin';
const canEdit = (r,u) => !!r && !!u && (isAdmin(u) || (u.role==='teacher' && r.teacherIds.includes(u.id)));
const roomsFor = u => !u ? [] : isAdmin(u) ? S.rooms : S.rooms.filter(r => r.teacherIds.includes(u.id) || r.studentIds.includes(u.id));
function seesAsStudent(it,sid){
  const r = R(it.roomId); if(!r || !r.studentIds.includes(sid)) return false;
  if(it.studentIds && it.studentIds.length && !it.studentIds.includes(sid)) return false;
  const c = CHP(it.chapterId); if(c && c.studentId && c.studentId !== sid) return false;
  return true;
}
function canSee(it,u){ const r = R(it.roomId); if(!r) return false; if(canEdit(r,u)) return true; return seesAsStudent(it,u.id); }
const assignees = it => { const r = R(it.roomId); return r ? r.studentIds.filter(s => seesAsStudent(it,s)) : []; };
const subOf = (itId,sid) => S.submissions.find(s => s.itemId===itId && s.studentId===sid);
const testRes = (itId,sid) => S.testResults.find(t => t.itemId===itId && t.studentId===sid);
function getSub(itId,sid){ let s = subOf(itId,sid); if(!s){ s = {id:uid('s'),itemId:itId,studentId:sid,status:'draft',attachments:[],text:'',thread:[]}; S.submissions.push(s); } s.thread = s.thread||[]; return s; }
function status(it,sid){
  const past = it.due && Date.now() > it.due;
  if(it.kind==='test'){ const tr = testRes(it.id,sid); return tr ? {t:'Splněno',c:'green',done:true} : past ? {t:'Chybí',c:'red'} : {t:'Přiřazeno',c:''}; }
  const s = subOf(it.id,sid);
  if(s && s.status==='returned') return {t:'Ohodnoceno',c:'green',done:true};
  if(s && s.status==='submitted') return {t:(it.due && s.submittedAt > it.due) ? 'Odevzdáno pozdě' : 'Odevzdáno', c:'blue', done:true};
  return past ? {t:'Chybí',c:'red'} : {t:'Přiřazeno',c:''};
}
function resultOf(it,sid){
  if(it.kind==='task'){ const s = subOf(it.id,sid); return s && s.status==='returned' ? {p:s.points,g:s.grade,c:s.comment,max:it.maxPoints} : null; }
  const tr = testRes(it.id,sid); return tr ? {p:tr.score,g:tr.grade,c:tr.comment,max:tr.max||it.maxPoints} : null;
}
function summary(r,sid){
  const its = S.items.filter(i => i.roomId===r.id && (i.kind==='task'||i.kind==='test') && seesAsStudent(i,sid));
  let p=0,max=0; const gs=[];
  its.forEach(i => { const x = resultOf(i,sid); if(x){ if(x.p!=null){ p+= +x.p; max += +(x.max||0); } if(gradeVal(x.g)!=null) gs.push(gradeVal(x.g)); } });
  S.grades.filter(g => g.roomId===r.id && g.studentId===sid).forEach(g => { if(g.points!=null && g.points!==''){ p += +g.points; max += +(g.maxPoints||0); } if(gradeVal(g.grade)!=null) gs.push(gradeVal(g.grade)); });
  const done = its.filter(i => status(i,sid).done).length, missing = its.filter(i => status(i,sid).c==='red').length;
  return {its,p,max,avg: gs.length ? gs.reduce((a,b)=>a+b,0)/gs.length : null, done, missing, total:its.length};
}
function upcoming(r,u){
  const ed = canEdit(r,u);

}

function newRoom(s,subjectId,teacherId){
  const t = s.users.find(u=>u.id===teacherId);
  const r = {id:uid('r'),name:(s.subjects.find(x=>x.id===subjectId)||{}).name||'Učebna',section:t?t.name:'',subjectId,teacherIds:teacherId?[teacherId]:[],studentIds:[],manual:[],auto:true,color:COLORS[s.rooms.length % COLORS.length],createdAt:Date.now()};
  s.rooms.push(r); return r;
}
function autoAssign(s){
  s = s || S; const log = []; const want = new Set();
  const sname = id => (s.subjects.find(x=>x.id===id)||{}).name || id;
  const teachersOf = sid => s.users.filter(u => u.role==='teacher' && (u.subjects||[]).includes(sid));
  for(const st of s.users.filter(u=>u.role==='student')){
    for(const en of (st.enroll||[])){
      let tId = en.teacherId && s.users.some(u=>u.id===en.teacherId) ? en.teacherId : null;
      let r = null;
      if(!tId){
        r = s.rooms.find(x => x.auto!==false && x.subjectId===en.subjectId && x.studentIds.includes(st.id));
        if(!r){
          const ts = teachersOf(en.subjectId);
          if(!ts.length){ log.push(`⚠ ${st.name}: předmět „${sname(en.subjectId)}“ nemá žádného učitele`); continue; }
          const load = t => s.rooms.filter(x=>x.subjectId===en.subjectId && x.teacherIds.includes(t.id)).reduce((a,x)=>a+x.studentIds.length,0);
          ts.sort((a,b)=>load(a)-load(b)); tId = ts[0].id;
        }
      }
      if(!r){
        r = s.rooms.find(x => x.auto!==false && x.subjectId===en.subjectId && x.teacherIds.includes(tId));
        if(!r){ r = newRoom(s,en.subjectId,tId); log.push(`+ Vytvořena učebna ${r.name} (${r.section})`); }
      }
      want.add(r.id+'|'+st.id);
      if(!r.studentIds.includes(st.id)){ r.studentIds.push(st.id); log.push(`→ ${st.name} přiřazen(a) do ${r.name} (${r.section})`); }
    }
  }
  for(const t of s.users.filter(u=>u.role==='teacher'))
    for(const sid of (t.subjects||[]))
      if(!s.rooms.some(r=>r.subjectId===sid && r.teacherIds.includes(t.id))){ const r = newRoom(s,sid,t.id); log.push(`+ Vytvořena učebna ${r.name} (${r.section})`); }
  for(const r of s.rooms) if(r.auto!==false){
    r.studentIds = r.studentIds.filter(sid => {
      const keep = want.has(r.id+'|'+sid) || (r.manual||[]).includes(sid) || !s.users.some(u=>u.id===sid && u.role==='student');
      if(!keep) log.push(`− ${(s.users.find(u=>u.id===sid)||{}).name||sid} odebrán(a) z ${r.name} (${r.section}) – předmět už nemá zapsaný`);
      return keep;
    });
  }
  return log;
}

  const extra = [(i.attachments||[]).length?`${i.attachments.length} soub.`:'',(i.links||[]).length?`${i.links.length} odkaz${i.links.length>1?'y':''}`:''].filter(Boolean).join(' · ');
  return `<div class="irow" data-act="open-item" data-id="${i.id}">${kIcon(i.kind)}<div class="grow"><div class="it ell">${esc(i.title)}</div><div class="mut xs">${KIND[i.kind].l} · ${meta}${extra?' · '+extra:''} ${ed?targetChip(i):''}</div></div>${right}${ed?`<button class="iconbtn s" data-act="item-up" data-id="${i.id}" title="Posunout nahoru">${ic('up',16)}</button><button class="iconbtn s" data-act="item-down" data-id="${i.id}" title="Posunout dolů">${ic('down',16)}</button><button class="iconbtn s" data-act="item-edit" data-id="${i.id}" title="Upravit">${ic('edit',16)}</button>`:''}</div>`;
}

function tPeople(r,u,ed){
  const sec = (t,ids,role) => `<div class="people"><div class="row sp ph"><h2>${t}</h2>${isAdmin(u)?`<button class="iconbtn" data-act="room-edit" data-id="${r.id}" title="Upravit členy">${ic('useradd')}</button>`:`<span class="mut">${ids.length}</span>`}</div>${ids.map(U).filter(Boolean).map(p=>`<div class="prow">${av(p,36)}<div class="grow">${esc(p.name)}${p.id===u.id?' <span class="mut xs">(vy)</span>':''}</div>${ed&&role==='s'?`<button class="btn sm ghost" data-act="student-card" data-id="${p.id}">${ic('award',16)}Karta hodnocení</button>`:''}</div>`).join('')||'<p class="mut">Zatím nikdo</p>'}</div>`;
  let h = sec('Učitelé',r.teacherIds,'t');
  h += ed ? sec('Studenti',r.studentIds,'s') : sec('Studenti',[u.id],'s');

}

function tGrades(r,u,ed){
  if(!ed) return studentCard(r,u.id,false);
  const cols = S.items.filter(i => i.roomId===r.id && (i.kind==='task'||i.kind==='test') && (!i.fromLesson || i.maxPoints || r.studentIds.some(s => { const x = resultOf(i,s); return x && (x.p!=null || x.g); }))).sort((a,b)=>(a.due||a.createdAt)-(b.due||b.createdAt));
  if(!r.studentIds.length) return `<div class="card">${empty('V učebně nejsou žádní studenti','','users')}</div>`;
  const head = `<tr><th>Student</th>${cols.map(c=>`<th class="col"><a class="lnk sm" data-act="open-item" data-id="${c.id}" style="padding:0">${esc(c.title)}</a><div class="mut xs">${KIND[c.kind].l}${c.due?' · '+fmtD(c.due):''}${c.maxPoints?' · z '+c.maxPoints:''}</div></th>`).join('')}<th>Body</th><th>Průměr</th></tr>`;
  const rows = r.studentIds.map(sid => {
    const sm = summary(r,sid);
    return `<tr><td><div class="row" style="cursor:pointer" data-act="student-card" data-id="${sid}">${av(U(sid),28)}<a class="lnk" style="padding:0">${esc(uname(sid))}</a></div></td>${cols.map(c=>{
      if(!seesAsStudent(c,sid)) return `<td class="na" title="Nepřiřazeno"></td>`;
      const x = resultOf(c,sid), st = status(c,sid);
      const inner = x ? `<span class="pts">${x.p!=null?fmtNum(x.p)+(x.max?'/'+x.max:''):''}</span>${x.g?`<span class="gr">${esc(x.g)}</span>`:''}` : `<span class="chip ${st.c} xs">${st.t}</span>`;
      return `<td class="c" data-act="grade-cell" data-id="${c.id}|${sid}">${inner}</td>`;
    }).join('')}<td><b>${fmtNum(sm.p)}</b>${sm.max?`<span class="mut xs">/${sm.max}</span>`:''}</td><td><b>${sm.avg!=null?fmtNum(sm.avg):'–'}</b></td></tr>`;
  }).join('');
  return `<div class="phead"><div><h2>Hodnocení</h2><p class="mut sm" style="margin:4px 0 0">Klikněte na buňku pro ohodnocení, na jméno pro kartu studenta (body, známky, komentáře).</p></div></div><div class="tblw"><table class="tbl gb">${head}${rows}</table></div>`;
}
function studentCard(r,sid,ed){
  const st = U(sid); if(!st) return '';
  const sm = summary(r,sid);
  const manual = S.grades.filter(g => g.roomId===r.id && g.studentId===sid).sort((a,b)=>b.date-a.date);
  const tile = (v,l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  let h = `<div class="card pad" style="margin-bottom:16px"><div class="row">${av(st,52)}<div class="grow"><h2>${esc(st.name)}</h2><div class="mut">${esc(r.name)} · ${esc(r.section||'')}</div></div></div></div>`;
  h += `<div class="row stats">${tile(fmtNum(sm.p)+(sm.max?`<small class="mut" style="font-size:14px">/${sm.max}</small>`:''),'Body celkem')}${tile(sm.avg!=null?fmtNum(sm.avg):'–','Průměrná známka')}${tile(sm.done+'/'+sm.total,'Splněno úkolů a testů')}${tile(sm.missing,'Chybí')}</div>`;
  const rows = sm.its.sort((a,b)=>(b.due||b.createdAt)-(a.due||a.createdAt)).map(i => { const x = resultOf(i,sid), s = status(i,sid);
    return `<tr data-act="${ed?'grade-cell':'open-item'}" data-id="${ed?i.id+'|'+sid:i.id}" style="cursor:pointer"><td><div class="row">${kIcon(i.kind,28)}<span>${esc(i.title)}</span></div></td><td class="hide-sm">${i.due?fmtD(i.due):'–'}</td><td><span class="chip ${s.c}">${s.t}</span></td><td><b>${x&&x.p!=null?fmtNum(x.p)+(x.max?'/'+x.max:''):'–'}</b></td><td><b>${x&&x.g?esc(x.g):'–'}</b></td><td class="sm">${x&&x.c?nl(x.c):'<span class="mut">–</span>'}</td></tr>`; }).join('');
  h += `<h3 style="margin:8px 0 10px">Úkoly a testy</h3><div class="tblw" style="margin-bottom:24px"><table class="tbl"><tr><th>Položka</th><th class="hide-sm">Termín</th><th>Stav</th><th>Body</th><th>Známka</th><th>Komentář učitele</th></tr>${rows||`<tr><td colspan="6" class="mut">Zatím žádné úkoly ani testy</td></tr>`}</table></div>`;
  h += `<div class="row sp" style="margin-bottom:10px"><h3>Další známky a komentáře</h3>${ed?`<button class="btn sm" data-act="grade-new" data-id="${sid}">${ic('plus',16)}Přidat hodnocení</button>`:''}</div>`;
  h += manual.length ? manual.map(g => `<div class="card pad" style="margin-bottom:10px"><div class="row"><div class="ic" style="background:var(--b6)">${ic('award',18)}</div><div class="grow"><b>${esc(g.label||'Hodnocení')}</b><div class="mut xs">${fmtD(g.date)} · ${esc(uname(g.by))}</div></div>${g.points!=null&&g.points!==''?`<span class="chip blue">${fmtNum(+g.points)}${g.maxPoints?'/'+g.maxPoints:''} b.</span>`:''}${g.grade?`<span class="chip green" style="font-size:14px">${esc(g.grade)}</span>`:''}${ed?`<button class="iconbtn s" data-act="grade-edit" data-id="${g.id}">${ic('edit',16)}</button><button class="iconbtn s" data-act="grade-del" data-id="${g.id}">${ic('trash',16)}</button>`:''}</div>${g.comment?`<div class="cm" style="margin-left:48px">${nl(g.comment)}</div>`:''}</div>`).join('') : `<p class="mut">Zatím žádná další hodnocení.</p>`;
  return h;
}

/* ---------- item detail ---------- */
function vItem(u){
  const it = I(ui.itemId);
  if(!it || !canSee(it,u)) return wrap(empty('Položka není dostupná','Byla smazána nebo k ní nemáte přístup.'));
  const r = R(it.roomId), ed = canEdit(r,u);
  const back = `<a class="lnk back" data-act="back-room">${ic('back',16)} Zpět do učebny</a>`;
  let sub = '';
  if(ed && it.kind==='task'){
    const n = assignees(it).filter(s=>status(it,s).done).length;
    sub = `<nav class="tabs">${[['zadani','Zadání'],['prace',`Odevzdané práce (${n})`]].map(([a,l])=>`<div class="tab ${ui.subTab===a?'on':''}" data-act="subtab" data-id="${a}">${l}</div>`).join('')}</nav>`;
    if(ui.subTab==='prace') return sub + wrap(back + submissionsView(it));

  const auth = U(it.authorId);
  const head = `<div class="ihead">${kIcon(it.kind,46)}<div class="grow"><h1>${esc(it.title)}</h1><div class="mut sm">${esc(auth?auth.name:'')} · ${it.kind==='lesson'?'hodina '+fmtD(it.lessonDate):fmtD(it.createdAt)}${it.editedAt?' (upraveno)':''} ${it.source==='is'?'<span class="chip blue">z kalendáře IS</span>':''}</div><div class="row sp" style="margin-top:10px;flex-wrap:wrap">${it.maxPoints?`<b>${it.maxPoints} bodů</b>`:'<span></span>'}${it.due?`<b>Termín: ${fmtDT(it.due)}</b>`:''}</div></div>${ed?`<div class="acts"><button class="iconbtn" data-act="item-edit" data-id="${it.id}" title="Upravit">${ic('edit',18)}</button><button class="iconbtn" data-act="item-del" data-id="${it.id}" title="Smazat">${ic('trash',18)}</button></div>`:''}</div>`;
  const hw = it.kind==='lesson' && it.homeworkId && I(it.homeworkId);
  const les = it.lessonId && I(it.lessonId);
  let main = `<div class="card pad">${head}<hr>${it.body?`<div class="body">${nl(it.body)}</div>`:''}${attList(it.attachments)}${linkList(it.links)}${it.kind==='test'?testBox(it,u,ed):''}${hw?`<div class="hwlink" data-act="open-item" data-id="${hw.id}">${ic('task',18)}<span>Domácí úkol z hodiny: <b>${esc(hw.title)}</b></span></div>`:''}${it.fromLesson&&CHP(it.lessonChapterId)?`<p class="sm"><a class="lnk" data-act="open-lesson" data-id="${it.lessonChapterId}">${ic('cal',14)} Zadáno v hodině ${esc(lesDate(CHP(it.lessonChapterId).lesson))}${it.autoDue!==false?' · termín odevzdání je začátek další hodiny':''}</a></p>`:''}${les&&canSee(les,u)?`<p class="sm"><a class="lnk" data-act="open-item" data-id="${les.id}">${ic('cal',14)} Zadáno v hodině ${fmtD(les.lessonDate)}</a></p>`:''}${ed?`<hr><p class="mut xs" style="margin:0">Vidí: ${assignees(it).map(s=>esc(uname(s))).join(', ')||'zatím nikdo'}</p>`:''}</div>`;
  const side = !ed && it.kind==='task' ? yourWork(it,u) : '';
  return sub + `<div class="wrap">${back}<div class="${side?'icols':''}"><div>${main}</div>${side?`<div>${side}</div>`:''}</div></div>`;

function attList(a,delAct,ctx=''){
  if(!a || !a.length) return '';
  return `<div class="atts">${a.map((f,idx)=>{ const e = extInfo(f.name); return `<div class="att" data-act="preview" data-id="${f.id}" title="${esc(f.name)}"><div class="ext" style="background:${e.c}">${e.l}</div><div class="grow"><div class="ell">${esc(f.name)}</div><div class="mut xs">${fsize(f.size)}</div></div>${delAct?`<button type="button" class="iconbtn s" data-act="${delAct}" data-id="${ctx}${idx}" title="Odebrat">${ic('x',14)}</button>`:''}</div>`; }).join('')}</div>`;
}
function linkList(l){
  if(!l || !l.length) return '';
  return `<div class="atts">${l.map(x=>{ const k = linkInfo(x.url); return `<a class="att" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener"><div class="ext" style="background:${k.c}">${k.l}</div><div class="grow"><div class="ell">${esc(x.title||x.url)}</div><div class="mut xs ell">${esc(host(x.url))}</div></div>${ic('link',16)}</a>`; }).join('')}</div>`;
}
function testBox(it,u,ed){
  const t = S.tests.find(x=>x.id===it.testId);
  const tname = t ? t.name : (it.testId || 'Test v Opakovačce');
  const head = `<div class="row">${kIcon('test',36)}<div class="grow"><b>${esc(tname)}</b><div class="mut xs">Aplikace Testy (Opakovačka) v IS${t&&t.questions?' · '+t.questions+' otázek':''}</div></div>${it.pin?`<span class="chip violet" style="font-size:14px">PIN ${esc(it.pin)}</span>`:''}</div>`;
  const how = `<p class="sm" style="margin:10px 0 0">Test spustíš v IS: <b>Aplikace → Testy</b>${it.pin?` a zadej PIN <b>${esc(it.pin)}</b>`:', PIN ti dá učitel'}.</p>`;
  if(ed){
    const rows = assignees(it).map(s => { const tr = testRes(it.id,s); const max = tr&&tr.max || it.maxPoints || '';
      return `<tr><td>${esc(uname(s))}</td><td><div class="row" style="gap:6px"><input type="number" step="0.5" min="0" style="width:84px;padding:5px 8px" value="${tr&&tr.score!=null?tr.score:''}" data-change="test-score" data-id="${it.id}|${s}" placeholder="body"><span class="mut sm">/ ${esc(max||'–')}</span></div></td><td><select data-change="test-grade" data-id="${it.id}|${s}" style="width:auto;padding:4px 8px"><option value="">—</option>${GRADES.map(g=>`<option ${tr&&tr.grade===g?'selected':''}>${g}</option>`).join('')}</select></td><td class="hide-sm mut xs">${tr?fmtDT(tr.at):''}</td></tr>`; }).join('');
    return `<div class="testbox">${head}${how}</div><p class="mut xs" style="margin:6px 0">Výsledky z Opakovačky sem zapište ručně (body a známku). Student je uvidí ve svém hodnocení.</p><div class="tblw"><table class="tbl"><tr><th>Student</th><th>Body</th><th>Známka</th><th class="hide-sm">Zapsáno</th></tr>${rows||'<tr><td colspan="4" class="mut">Nikomu nepřiřazeno</td></tr>'}</table></div>`;
  }
  const tr = testRes(it.id,u.id);
  return `<div class="testbox">${head}${tr?'':how}</div>${tr?`<div class="graded"><div class="big">${tr.score!=null?fmtNum(tr.score):'–'}<small>/${esc(tr.max||it.maxPoints||'–')} bodů</small></div>${tr.grade?`<div>Známka: <b>${esc(tr.grade)}</b></div>`:''}${tr.comment?`<div class="cm">${nl(tr.comment)}</div>`:''}</div>`:''}`;
}
function yourWork(it,u){
  const s = subOf(it.id,u.id); const st = status(it,u.id);
  const locked = s && (s.status==='submitted' || s.status==='returned');
  let h = `<div class="card pad"><div class="row sp"><h3>Vaše práce</h3><span class="chip ${st.c}">${st.t}</span></div>`;
  if(s && s.status==='returned') h += `<div class="graded">${s.points!=null?`<div class="big">${fmtNum(s.points)}<small>/${it.maxPoints||'–'} bodů</small></div>`:''}${s.grade?`<div>Známka: <b>${esc(s.grade)}</b></div>`:''}${s.comment?`<div class="cm">${nl(s.comment)}</div>`:''}</div>`;
  h += attList(s ? s.attachments : [], locked ? null : 'sub-att-del', it.id+'|') + `<div id="upl-${it.id}">${uplHtml(it.id)}</div>`;
  if(!locked){
    h += `<label class="btn full" style="margin:8px 0">${ic('upload',16)}Přidat soubor<input type="file" multiple hidden data-change="sub-file" data-id="${it.id}"></label><textarea data-change="sub-text" data-id="${it.id}" placeholder="Odpověď nebo poznámka pro učitele (nepovinné)" style="min-height:70px;margin-bottom:10px">${esc(s?s.text:'')}</textarea><button class="btn pri full" data-act="sub-submit" data-id="${it.id}">${ic('check',16)}${s&&(s.attachments||[]).length?'Odevzdat':'Označit jako hotové'}</button>`;
  } else {
    if(s.text) h += `<div class="body sm" style="margin-top:10px">${nl(s.text)}</div>`;
    h += `<p class="mut xs">Odevzdáno ${fmtDT(s.submittedAt)}</p><button class="btn full" data-act="sub-unsubmit" data-id="${it.id}">${s.status==='returned'?'Upravit a odevzdat znovu':'Zrušit odevzdání'}</button>`;
  }
  h += `</div>` + thread(it,u.id);
  return h;
}
function thread(it,sid){
  const s = subOf(it.id,sid); const msgs = (s && s.thread) || [];
  return `<div class="card pad thread"><h4 class="row" style="gap:6px">${ic('chat',16)}Soukromé komentáře</h4>${msgs.map(m=>`<div class="msg">${av(U(m.by),28)}<div class="bub"><b class="sm">${esc(uname(m.by))}</b> <span class="mut xs">${fmtDT(m.at)}</span><div class="sm">${nl(m.text)}</div></div></div>`).join('')}<form data-form="thread" data-id="${it.id}|${sid}" class="row" style="margin-top:8px"><input name="text" placeholder="Přidat soukromý komentář…" required><button class="iconbtn" title="Odeslat">${ic('chev',18)}</button></form></div>`;
}
function submissionsView(it){
  const as = assignees(it);
  const cnt = k => as.filter(s => (subOf(it.id,s)||{}).status===k).length;
  const sel = ui.subStudent && as.includes(ui.subStudent) ? ui.subStudent : (as.find(x => (subOf(it.id,x)||{}).status==='submitted') || as[0]);
  const stat = (v,l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const list = as.map(s => { const st = status(it,s), sb = subOf(it.id,s);
    return `<div class="sitem ${s===sel?'on':''}" data-act="sub-sel" data-id="${s}">${av(U(s),28)}<div class="grow"><div class="ell">${esc(uname(s))}</div><span class="chip ${st.c}" style="font-size:11px">${st.t}</span></div><b class="sm">${sb&&sb.points!=null?fmtNum(sb.points)+(it.maxPoints?'/'+it.maxPoints:''):(sb&&sb.grade?esc(sb.grade):'')}</b></div>`; }).join('');
  return `<h2 style="margin-bottom:12px">${esc(it.title)}</h2><div class="row stats">${stat(cnt('submitted')+cnt('returned'),'Odevzdáno')}${stat(as.length-cnt('submitted')-cnt('returned'),'Neodevzdáno')}${stat(cnt('submitted'),'Čeká na hodnocení')}${stat(cnt('returned'),'Ohodnoceno')}</div><div class="cols"><div class="card scope" style="top:190px">${list||'<p class="mut">Nikomu nepřiřazeno</p>'}</div><div>${sel?gradePanel(it,sel):''}</div></div>`;
}
function gradePanel(it,sid){
  const s = subOf(it.id,sid), us = U(sid), st = status(it,sid);
  let h = `<div class="card pad"><div class="row">${av(us,42)}<div class="grow"><h3>${esc(us.name)}</h3><span class="mut xs">${s&&s.submittedAt&&s.status!=='draft'?'Odevzdáno '+fmtDT(s.submittedAt):'Zatím neodevzdáno'}</span></div><span class="chip ${st.c}">${st.t}</span></div><hr>`;
  const has = s && s.status!=='draft' && ((s.attachments||[]).length || s.text);
  h += has ? attList(s.attachments) + (s.text?`<div class="body" style="padding:10px 12px;background:#f8fafc;border-radius:8px">${nl(s.text)}</div>`:'') : `<p class="mut">Student zatím nic neodevzdal. Hodnocení můžete zadat i tak (např. za práci v hodině).</p>`;
  h += `<form data-form="grade" data-id="${it.id}|${sid}" style="display:grid;gap:12px;margin-top:12px"><div class="g2"><div class="field"><label>Body${it.maxPoints?' (max. '+it.maxPoints+')':''}</label><input type="number" name="points" step="0.5" min="0" ${it.maxPoints?`max="${it.maxPoints}"`:''} value="${s&&s.points!=null?s.points:''}"></div><div class="field"><label>Známka</label><select name="grade"><option value="">—</option>${GRADES.map(g=>`<option ${s&&s.grade===g?'selected':''}>${g}</option>`).join('')}</select></div></div><div class="field"><label>Komentář pro studenta</label><textarea name="comment" placeholder="Co se povedlo, na čem zapracovat…">${esc(s&&s.comment||'')}</textarea></div><div class="row end"><button class="btn pri">${ic('check',16)}Uložit a vrátit studentovi</button></div></form></div>`;
  return h + thread(it,sid);
}

/* ---------- todo ---------- */
function vTodo(u){
  if(u.role==='student'){
    const its = S.items.filter(i => (i.kind==='task'||i.kind==='test') && seesAsStudent(i,u.id));
    const g = {Přiřazeno:[],Chybí:[],Hotovo:[]};
    its.forEach(i => { const s = status(i,u.id); (s.done ? g.Hotovo : s.c==='red' ? g.Chybí : g.Přiřazeno).push(i); });
    g.Přiřazeno.sort((a,b)=>(a.due||9e15)-(b.due||9e15));
    const sec = (k,arr) => `<section class="card chap"><div class="chh"><div class="cht"><h3>${k}</h3><span class="chip ${k==='Chybí'?'red':k==='Hotovo'?'green':''}">${arr.length}</span></div></div>${arr.length?arr.map(i=>todoRow(i,u)).join(''):'<div class="irow noitem">Nic tu není</div>'}</section>`;
    return wrap(`<div class="phead"><h1>Moje úkoly</h1></div>` + sec('Přiřazeno',g.Přiřazeno) + sec('Chybí',g.Chybí) + sec('Hotovo',g.Hotovo));
  }
  const rs = roomsFor(u).filter(r=>canEdit(r,u));
  const its = S.items.filter(i => i.kind==='task' && rs.some(r=>r.id===i.roomId)).map(i => ({i,n:assignees(i).filter(s=>(subOf(i.id,s)||{}).status==='submitted').length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);

function saveItem(f,existing,r){
  if(uplBusy('pend')){ toast('Počkejte, až se soubory nahrají.'); return false; }
  const fd = new FormData(f); const g = k => (fd.get(k)||'').toString();

  if(!g('title').trim()){ toast('Vyplňte název'); return false; }
  const sids = g('aud')==='sel' ? fd.getAll('sids') : null;
  if(sids && !sids.length){ toast('Vyberte alespoň jednoho studenta'); return false; }
  const o = existing || {id:uid('i'),roomId:r.id,createdAt:Date.now(),authorId:me};
  Object.assign(o,{kind,title:g('title').trim(),body:g('body'),chapterId:g('chapterId')||null,studentIds:sids,attachments:PEND.slice(),links:parseLinks(g('links'))});
  o.due = (kind==='task'||kind==='test') && g('due') ? new Date(g('due')).getTime() : null;
  o.maxPoints = (kind==='task'||kind==='test') && g('maxPoints')!=='' ? +g('maxPoints') : null;
  o.testId = kind==='test' ? g('testId') : null;
  o.pin = kind==='test' ? g('pin').replace(/\s/g,'') : null;
  if(kind==='lesson') o.lessonDate = g('lessonDate') ? new Date(g('lessonDate')+'T12:00').getTime() : Date.now();
  if(existing) o.editedAt = Date.now(); else S.items.push(o);
  changed(); toast(existing?'Uloženo':`${KIND[kind].l} zveřejněn${kind==='task'||kind==='test'?'':'o'}`.replace('Úkol zveřejněn','Úkol zveřejněn').replace('Materiál zveřejněno','Materiál zveřejněn').replace('Zápis hodiny zveřejněno','Zápis hodiny uložen'));
  return true;
}

function handleLesson(L){
  if(!L) return;
  let r = L.roomId && R(L.roomId);
  if(!r) r = S.rooms.find(x=>x.subjectId===L.subjectId && x.teacherIds.includes(L.teacherId));
  if(!r && L.studentIds && L.studentIds.length) r = S.rooms.find(x=>x.subjectId===L.subjectId && L.studentIds.every(s=>x.studentIds.includes(s)));
  if(!r){ logPush(['⚠ Zápis hodiny „'+(L.topic||'')+'“: nenalezena učebna pro předmět/učitele'],'Zápis z kalendáře'); toast('Pro zápis nebyla nalezena učebna'); return; }
  const sids = L.studentIds && L.studentIds.length && L.studentIds.length < r.studentIds.length ? L.studentIds.filter(s=>r.studentIds.includes(s)) : null;
  let ch = S.chapters.find(c=>c.roomId===r.id && !c.studentId && c.title==='Zápisy z hodin');
  if(!ch){ ch = {id:uid('c'),roomId:r.id,title:'Zápisy z hodin',order:Math.min(0,...S.chapters.filter(c=>c.roomId===r.id).map(c=>c.order))-1,studentId:null}; S.chapters.push(ch); }
  const when = L.date ? new Date(L.date).getTime() : Date.now();
  let les = L.id && S.items.find(i=>i.isId===L.id);
  if(!les){ les = {id:uid('i'),roomId:r.id,kind:'lesson',createdAt:Date.now(),attachments:[],links:[],source:'is',isId:L.id}; S.items.push(les); }
  Object.assign(les,{chapterId:les.chapterId||ch.id,authorId:L.teacherId||r.teacherIds[0],title:L.topic||'Zápis hodiny',body:L.content||'',lessonDate:when,studentIds:sids,attachments:L.attachments||les.attachments,links:L.links?L.links.map(l=>typeof l==='string'?{title:'',url:safeUrl(l)}:l):les.links});
  if(L.homework && L.homework.title){
    let hw = les.homeworkId && I(les.homeworkId);
    if(!hw){ hw = {id:uid('i'),roomId:r.id,kind:'task',createdAt:Date.now(),attachments:[],links:[],source:'is'}; S.items.push(hw); les.homeworkId = hw.id; }
    Object.assign(hw,{chapterId:hw.chapterId||ch.id,authorId:les.authorId,title:L.homework.title,body:L.homework.description||'',due:L.homework.due?new Date(L.homework.due).getTime():null,maxPoints:L.homework.maxPoints??null,studentIds:sids,lessonId:les.id});
  }
  logPush([`✓ Zápis „${les.title}“ (${fmtD(when)}) → ${r.name} (${r.section})${les.homeworkId?' + domácí úkol':''}`],'Zápis z kalendáře');
  changed(); toast('Zápis hodiny propsán do učebny');
}
function handleTestResult(x){
  if(!x) return;
  let it = x.itemId && I(x.itemId);
  if(!it) it = S.items.find(i=>i.kind==='test' && i.testId===x.testId && seesAsStudent(i,x.studentId));
  if(!it) return;
  let tr = testRes(it.id,x.studentId);
  if(!tr){ tr = {id:uid('t'),itemId:it.id,studentId:x.studentId}; S.testResults.push(tr); }
  Object.assign(tr,{score:+x.score,max:+(x.max||it.maxPoints||x.score),at:x.at?new Date(x.at).getTime():Date.now()});
  if(x.grade) tr.grade = x.grade;
  changed(); toast('Výsledek testu zapsán');
}
const fold = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/\s+/).filter(Boolean).sort().join(' ');
const flipName = n => { const p = String(n||'').trim().split(/\s+/); return p.length>1 ? p.slice(1).join(' ')+' '+p[0] : String(n||''); };
function renameUser(oldId,newId){ if(oldId===newId || U(newId)) return; S = JSON.parse(JSON.stringify(S).split('"'+oldId+'"').join('"'+newId+'"')); }
/* přihlášení: IS pošle omezený klíč (ap1.…), Učebna ho ověří u serveru IS akcí "me" */
/* zápisy hodin: IS dá vědět (is:lessons / is:lesson / is:lessonDelete), Učebna si je nechá načíst serverem přímo z IS */
let pullTimer = null;
const lessonSig = () => S.chapters.filter(c=>c.lesson).map(c=>c.id+':'+(c.lesson.sig||'')+(c.lesson.removed?'x':'')).sort().join('|');
function queuePull(){ clearTimeout(pullTimer); pullTimer = setTimeout(doPull, 1500); }
async function doPull(){
  if(!bridge.authed) return;
  if(saving || dirty){ pullTimer = setTimeout(doPull, 2000); return; }
  try {
    const before = lessonSig(); const v = await api('load',{pull:true});
    if(saving || dirty) return;
    applyView(v); if(!M && !typing()) render();
    if(before && before !== lessonSig()) toast('Zápisy hodin z IS aktualizovány');
  } catch(e){}
}
async function login(token){
  if(!/^[A-Za-z0-9._-]{8,300}$/.test(String(token||''))){ bridge.state='error'; bridge.err='Neplatný přihlašovací klíč.'; render(); send('auth-error',{error:bridge.err}); return; }
  const silent = !!me;
  TOKEN = token; if(!silent){ bridge.state = 'checking'; render(); }
  try {
    const v = await api('load');
    applyView(v); bridge.authed = true; bridge.state = 'ok'; bridge.err = '';
    if(!silent){ ui.view = 'home'; ui.roomId = null; }
    render(); send('auth-ok',{role:v.me.role});
    if(dirty) flush();
  } catch(err){
    if(silent && err.code==='net') return;
    me = null; bridge.authed = false; bridge.state = 'error'; TOKEN = null; S = emptyState();
    bridge.err = err.message || 'Přihlášení se nepodařilo.';
    render(); send('auth-error',{error:bridge.err});
  }
}
window.addEventListener('message', e => {
  if(e.source !== window.parent || e.origin !== CONFIG.isOrigin) return;
  const d = e.data; if(!d || typeof d!=='object' || typeof d.type!=='string') return;
  const type = d.type.replace(/^is:/,'');
  try {
    if(type==='auth'){ login(d.token); return; }
    if(type==='logout'){ me = null; TOKEN = null; S = emptyState(); SNAP = {}; bridge.authed = false; bridge.state = 'wait'; closeModal(); render(); return; }
    if(!bridge.authed) return;
    const u = cur(), staff = u && u.role!=='student';
    switch(type){
      case 'sync': {
        if(!staff) return;
        api('sync',{users:Array.isArray(d.users)?d.users:null,tests:Array.isArray(d.tests)?d.tests:null}).then(r=>{ if(!dirty&&!saving){ applyView(r.view); render(); } }).catch(()=>{});
        break; }
      case 'lessons': case 'lesson': case 'lessonDelete': queuePull(); break;
      case 'testResult': if(staff) handleTestResult(d.result); break;
      case 'navigate': if(d.roomId && R(d.roomId)){ ui.view='room'; ui.roomId=d.roomId; ui.tab=d.tab||'stream'; render(); } break;
    }
  } catch(err){ console.error('[Učebna] chyba zprávy z IS', err); }
});

  'grade-cell':id=>{ const [iid,sid]=id.split('|'); const it=I(iid); if(!it) return; go({view:'item',itemId:iid,roomId:it.roomId,subTab:it.kind==='task'?'prace':'zadani',subStudent:sid}); },
  'student-card':id=>go({view:'studentcard',studentId:id}),
  'item-new':k=>{ closeMenus(); itemModal(k); },
  'item-edit':id=>itemModal(null,I(id)),
  'item-del':id=>{ const it=I(id); confirmBox(`Smazat „${esc(it.title)}“ včetně odevzdaných prací?`,()=>{ S.items=S.items.filter(i=>i.id!==id); S.submissions=S.submissions.filter(s=>s.itemId!==id); S.testResults=S.testResults.filter(t=>t.itemId!==id); S.items.forEach(i=>{ if(i.homeworkId===id) delete i.homeworkId; }); ui.view='room'; ui.tab='work'; changed(); toast('Smazáno'); }); },
  'ch-new':()=>{ closeMenus(); chapterModal(); },
  'ch-edit':id=>chapterModal(CHP(id)),
  'ch-add':id=>itemModal('material',null,id),
  'ch-del':id=>{ const c=CHP(id); confirmBox(c.lesson?`Smazat hodinu „${esc(c.title)}“ z Učebny? Z IS se už znovu nevytvoří. Domácí úkol bez odevzdání se smaže, ostatní položky přejdou do „Bez kapitoly“.`:`Smazat kapitolu „${esc(c.title)}“? Položky v ní zůstanou v sekci „Bez kapitoly“.`,()=>{ S.chapters=S.chapters.filter(x=>x.id!==id); S.items.forEach(i=>{ if(i.chapterId===id) i.chapterId=null; }); changed(); }); },
  'ch-up':id=>moveCh(id,-1), 'ch-down':id=>moveCh(id,1),
  'item-up':id=>moveItem(id,-1), 'item-down':id=>moveItem(id,1),
  'ch-toggle':id=>{ ui.closed[id]=!ui.closed[id]; render(); },
  'preview':id=>{ if(document.querySelector('.modal[data-k]')){ toast('Náhled souboru otevřete po uložení.'); return; } previewAtt(id); },
  'upl-x':key=>{ const u=UPLOADS.find(x=>x.key===key); UPLOADS=UPLOADS.filter(x=>x.key!==key); if(u) uplPaint(u.ctx); },
  'pend-del':idx=>{ PEND.splice(+idx,1); $('#pend').innerHTML=pendHtml(); },
  'sub-att-del':id=>{ const [iid,idx]=id.split('|'); const s=subOf(iid,me); if(s){ s.attachments.splice(+idx,1); changed(); } },
  'sub-submit':id=>{ if(uplBusy(id)){ toast('Počkejte, až se soubory nahrají.'); return; } const s=getSub(id,me); const ta=document.querySelector(`textarea[data-change="sub-text"][data-id="${id}"]`); if(ta) s.text=ta.value; s.status='submitted'; s.submittedAt=Date.now(); changed(); toast('Odevzdáno'); },
  'sub-unsubmit':id=>{ const s=subOf(id,me); if(s){ s.status='draft'; changed(); toast('Odevzdání zrušeno – můžete práci upravit'); } },
  'sim-lesson':id=>lessonModal(R(id)),
  'post-del':id=>confirmBox('Smazat toto oznámení?',()=>{ S.posts=S.posts.filter(p=>p.id!==id); changed(); }),
  'room-new':()=>roomModal(),
  'room-edit':id=>roomModal(R(id)),
  'room-del':id=>{ const r=R(id); confirmBox(`Smazat učebnu „${esc(r.name)}“ (${esc(r.section||'')}) se všemi materiály, úkoly a hodnocením?`,()=>{ const ids=S.items.filter(i=>i.roomId===id).map(i=>i.id); S.rooms=S.rooms.filter(x=>x.id!==id); S.items=S.items.filter(i=>i.roomId!==id); S.chapters=S.chapters.filter(c=>c.roomId!==id); S.submissions=S.submissions.filter(s=>!ids.includes(s.itemId)); S.testResults=S.testResults.filter(t=>!ids.includes(t.itemId)); S.posts=S.posts.filter(p=>p.roomId!==id); S.grades=S.grades.filter(g=>g.roomId!==id); changed(); }); },
  'user-new':()=>userModal(),
  'user-edit':id=>userModal(U(id)),
  'user-del':id=>confirmBox(`Smazat uživatele ${esc(uname(id))}?`,()=>{ S.users=S.users.filter(u=>u.id!==id); S.rooms.forEach(r=>{ r.teacherIds=r.teacherIds.filter(x=>x!==id); r.studentIds=r.studentIds.filter(x=>x!==id); }); changed(); }),
  'auto-run':async ()=>{ try { const r = await api('autoAssign'); applyView(r.view); render(); toast(r.lines.length?`Synchronizace: ${r.lines.length} změn`:'Vše je správně přiřazeno'); } catch(e){ toast(e.message); } },
  'grade-new':sid=>gradeModal(sid),
  'grade-edit':id=>{ const g=S.grades.find(x=>x.id===id); gradeModal(g.studentId,g); },
  'grade-del':id=>confirmBox('Smazat toto hodnocení?',()=>{ S.grades=S.grades.filter(g=>g.id!==id); changed(); }),
  'copy-state':()=>{ try { navigator.clipboard.writeText(JSON.stringify(S,null,2)).then(()=>toast('Data zkopírována'),()=>toast('Kopírování se nepodařilo')); } catch(e){ toast('Kopírování se nepodařilo'); } },
  'modal-close':()=>closeModal(),

function moveCh(id,dir){
  const c = CHP(id); const sib = S.chapters.filter(x=>x.roomId===c.roomId && (x.studentId||null)===(c.studentId||null)).sort((a,b)=>a.order-b.order);
  const i = sib.indexOf(c), j = i+dir; if(j<0 || j>=sib.length) return;
  const t = sib[j].order; sib[j].order = c.order; c.order = t; if(sib[j].order===c.order) c.order += dir; changed();
}
function updateThemePreview(f){
  const fd = new FormData(f); const col = fd.get('color')==='custom' ? fd.get('colorCustom') : fd.get('color'); const th = fd.get('theme')||'kruhy';
  const pv = f.querySelector('#tprev'); if(pv) pv.setAttribute('style', themeStyle(col,th));
  f.querySelectorAll('.mt[data-motif]').forEach(m => m.setAttribute('style', themeStyle(col,m.dataset.motif)));
}
document.addEventListener('input', e => { if(e.target.name==='colorCustom' || e.target.name==='name' && e.target.form && e.target.form.querySelector('#tprev')){ const f=e.target.form; if(e.target.name==='colorCustom'){ f.querySelector('input[name=color][value=custom]').checked=true; updateThemePreview(f); } else { f.querySelector('#tprev h3').textContent = e.target.value || 'Název učebny'; } } });
const closeMenus = () => document.querySelectorAll('details.menu[open]').forEach(d=>d.open=false);
const CHG = {
  'sub-file':async (id,el)=>{ const fl=[...el.files]; el.value=''; await readFiles(fl,id,m=>{ const s = getSub(id,me); s.attachments = (s.attachments||[]).concat([m]); const ta=document.querySelector(`textarea[data-change="sub-text"][data-id="${id}"]`); if(ta) s.text=ta.value; changed(); }); uplPaint(id); },

  'pend-file':async (id,el)=>{ const fl=[...el.files]; el.value=''; await readFiles(fl,'pend',m=>{ PEND.push(m); uplPaint('pend'); }); uplPaint('pend'); },
  'theme-prev':(id,el)=>updateThemePreview(el.form),
  'theme-custom':(id,el)=>{ const rb=el.form.querySelector('input[name=color][value=custom]'); rb.checked=true; updateThemePreview(el.form); },

  'test-score':(id,el)=>{ const [iid,sid]=id.split('|'); const it=I(iid); let tr=testRes(iid,sid); if(el.value===''){ if(tr && !tr.grade){ S.testResults=S.testResults.filter(x=>x!==tr); changed(); } else if(tr){ tr.score=null; changed(); } return; } if(!tr){ tr={id:uid('t'),itemId:iid,studentId:sid,max:it.maxPoints}; S.testResults.push(tr); } tr.score=+el.value; tr.at=Date.now(); changed(); toast('Body uloženy'); }
};
document.addEventListener('click', e => {
  if(!e.target.closest('details.menu')) closeMenus();
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  if(a==='modal-bg' && e.target!==el) return;
  const fn = ACT[a]; if(!fn) return;
  if(el.tagName!=='A' || !el.getAttribute('href')) e.preventDefault();
  fn(el.dataset.id, el, e);
});

document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; const kind = f.dataset.form;
  if(kind==='modal'){ if(M && M.onSubmit && M.onSubmit(f)!==false) closeModal(); return; }
  const fd = new FormData(f);
  if(kind==='post'){ const text=(fd.get('text')||'').toString().trim(); if(!text) return; S.posts.push({id:uid('p'),roomId:f.dataset.id,authorId:me,createdAt:Date.now(),text,studentId:fd.get('to')||null}); changed(); toast('Oznámení zveřejněno'); }
  if(kind==='grade'){ const [iid,sid]=f.dataset.id.split('|'); const s=getSub(iid,sid); const p=fd.get('points'); s.points = p!=='' ? +p : null; s.grade = fd.get('grade')||''; s.comment = fd.get('comment')||''; if(s.status!=='submitted' && s.status!=='returned') s.submittedAt = s.submittedAt||null; s.status='returned'; s.gradedAt=Date.now(); s.gradedBy=me;
    const it=I(iid); const next=assignees(it).find(x=>x!==sid && (subOf(iid,x)||{}).status==='submitted'); ui.subStudent = next || sid; changed(); toast('Ohodnoceno a vráceno'+(next?' – další: '+uname(next):'')); }
  if(kind==='thread'){ const [iid,sid]=f.dataset.id.split('|'); const text=(fd.get('text')||'').toString().trim(); if(!text) return; const s=getSub(iid,sid); s.thread.push({by:me,text,at:Date.now()}); changed(); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && M) closeModal(); });
