<style>
/* layout: brand bar, month pills, four summary tiles, then student list beside the selected e-mail */
:root{--bg:#F2F7FF;--card:#FFFFFF;--ink:#10224F;--mute:#5A6B8F;--line:#DCE6F7;--brand:#1D4ED8;--royal:#3D6BFF;--sky:#2FA4F6;--sun:#FFD23F;--on-brand:#FFFFFF;--soft:#E6EEFF;--ok:#12805C;--ok-soft:#DDF5EB;--sh:0 4px 16px rgba(29,78,216,.08);
--font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1226;--card:#131C38;--ink:#E9EEFF;--mute:#9DAAD0;--line:#24305A;--brand:#6F93FF;--royal:#6F93FF;--sky:#4DB6FF;--on-brand:#0B1226;--soft:#1B2750;--ok:#4FD1A1;--ok-soft:#12352B;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1226;--card:#131C38;--ink:#E9EEFF;--mute:#9DAAD0;--line:#24305A;--brand:#6F93FF;--royal:#6F93FF;--sky:#4DB6FF;--on-brand:#0B1226;--soft:#1B2750;--ok:#4FD1A1;--ok-soft:#12352B;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
main{max-width:1080px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:52px;height:auto;display:block}
.word{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--brand);line-height:1}
.tag{font-size:14px;color:var(--mute);font-weight:500}.rt{display:flex;align-items:center;gap:12px}.rt .btn{padding:6px 14px}.btn:disabled{opacity:.6;cursor:default}
.months{display:flex;flex-wrap:wrap;gap:8px}
.months button{font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.months button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
button:focus-visible,.stu:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sky)}
.tile.main::before{background:var(--brand)}.tile.sent::before{background:var(--sun)}
.tile b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}.tile.main b{color:var(--brand)}
.tile span{font-size:13px;color:var(--mute);font-weight:500}
.work{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}@media(max-width:820px){.work{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.stu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.stu[aria-current="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.stu .n{flex:1;min-width:0}.stu strong{display:block;font-size:15px;font-weight:600}.stu small{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.stu.done .chk{color:var(--ok)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:18px}
.detail h2{margin:0;font-size:22px;font-weight:700}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}.dh p{margin:0;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
h3{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.mail{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}.mail .in{padding:14px 16px}.att{border-top:1px solid var(--line);padding:14px 16px;background:var(--card)}
.subj{margin:0 0 10px;font-weight:600;font-size:14px}.txt{white-space:pre-wrap;font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px;border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}a.btn{display:inline-block;text-decoration:none;line-height:1.5}
.meta{display:grid;grid-template-columns:70px 1fr;gap:2px 10px;font-size:14px;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}.meta dt{color:var(--mute);font-weight:500}.meta dd{margin:0;font-weight:600;word-break:break-word}.meta dd.empty{color:var(--mute);font-weight:400}
canvas{display:block;width:100%;max-width:760px;height:auto;border-radius:10px;border:1px solid var(--line)}
.tile.sent.done{border-color:var(--ok);background:var(--ok-soft)}.tile.sent.done::before{background:var(--ok)}.tile.sent.done b{color:var(--ok)}
